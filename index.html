<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>materi css</title>
    <style>
      .awok article,
      .awok img {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3 ease;
      }

      .awok:hover article,
      .awok:hover img {
        opacity: 1;
        visibility: visible;
      }

      span {
        font-size: 4rem;
        color: red;
      }

      img {
        width: 20%;
      }
    </style>
  </head>
  <body>
    <article>KLIK DIBAWAH TULISAN INI</article>
    <div class="awok">
      <img src="awok.jpg" alt="" />
      <article><span>AWOK WOK WOK WOK</span></article>
    </div>
  </body>
</html>
